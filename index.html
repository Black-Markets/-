<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Beautiful Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --soft-gold: #f4e4ba;
            --deep-rose: #8e44ad;
            --soft-rose: #ffd1dc;
            --glass: rgba(255, 255, 255, 0.15);
            --text-dark: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #fff5f8 0%, #e0c3fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            perspective: 1000px;
        }

        /* Background Elements */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Card */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
            transform-style: preserve-3d;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0) rotateX(2deg) rotateY(-2deg); }
            50% { transform: translateY(-20px) rotateX(-2deg) rotateY(2deg); }
        }

        .card-content {
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--deep-rose);
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #8e44ad, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 2.5rem;
        }

        .btn-premium {
            padding: 15px 40px;
            background: linear-gradient(45deg, #8e44ad, #a29bfe);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-premium:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 30px rgba(142, 68, 173, 0.4);
        }

        /* Floating Flowers & Butterflies */
        .floating-item {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .butterfly-premium {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 15;
            animation: flyPath 20s linear infinite;
        }

        .wing {
            position: absolute;
            width: 15px;
            height: 20px;
            background: rgba(255, 107, 107, 0.7);
            border-radius: 50% 50% 0 50%;
            transform-origin: right bottom;
            animation: flapPremium 0.2s infinite alternate;
        }

        .wing-right {
            left: 15px;
            border-radius: 50% 50% 50% 0;
            transform-origin: left bottom;
            animation-name: flapPremiumRight;
        }

        @keyframes flapPremium {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(75deg); }
        }

        @keyframes flapPremiumRight {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(-75deg); }
        }

        @keyframes flyPath {
            0% { transform: translate(-10vw, 20vh) rotate(0deg); }
            25% { transform: translate(30vw, 70vh) rotate(45deg); }
            50% { transform: translate(70vw, 10vh) rotate(-45deg); }
            75% { transform: translate(90vw, 50vh) rotate(20deg); }
            100% { transform: translate(110vw, 20vh) rotate(0deg); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 2s infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="card">
        <div class="card-content">
            <h1>Happy Birthday</h1>
            <div class="sub-title">Untuk Seseorang yang Luar Biasa</div>
            <p class="message">
                Di hari yang istimewa ini, semoga setiap langkahmu dipenuhi cahaya, 
                setiap impianmu menemukan jalannya, dan hatimu selalu dipenuhi 
                dengan kedamaian serta kebahagiaan yang tak terhingga.
            </p>
            <button class="btn-premium" onclick="triggerMagic()">Buka Keajaiban</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const flowers = ['🌸', '✨', '🌹', '🌷', '🤍', '🕊️'];
        
        function createFloatingItem() {
            const item = document.createElement('div');
            item.className = 'floating-item';
            item.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            const startX = Math.random() * window.innerWidth;
            const duration = 10 + Math.random() * 15;
            const size = 15 + Math.random() * 25;
            
            item.style.left = startX + 'px';
            item.style.bottom = '-50px';
            item.style.fontSize = size + 'px';
            item.style.opacity = 0.2 + Math.random() * 0.5;
            
            container.appendChild(item);
            
            const animation = item.animate([
                { transform: `translateY(0) rotate(0deg)`, opacity: 0 },
                { opacity: 0.8, offset: 0.2 },
                { transform: `translateY(-110vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                easing: 'linear'
            });
            
            animation.onfinish = () => item.remove();
        }

        function createButterfly() {
            const b = document.createElement('div');
            b.className = 'butterfly-premium';
            b.innerHTML = '<div class="wing"></div><div class="wing wing-right"></div>';
            
            const colors = ['#ff6b6b', '#a29bfe', '#fdcb6e', '#55efc4'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            b.querySelectorAll('.wing').forEach(w => w.style.background = color);
            
            document.body.appendChild(b);
            
            const duration = 15 + Math.random() * 10;
            b.style.animationDuration = duration + 's';
            
            setTimeout(() => b.remove(), duration * 1000);
        }

        function triggerMagic() {
            // Create burst of sparkles
            for(let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const s = document.createElement('div');
                    s.className = 'sparkle';
                    const size = Math.random() * 6 + 2;
                    s.style.width = size + 'px';
                    s.style.height = size + 'px';
                    s.style.left = '50%';
                    s.style.top = '50%';
                    
                    document.body.appendChild(s);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 100 + Math.random() * 300;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist;
                    
                    s.animate([
                        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                    ], {
                        duration: 1000 + Math.random() * 1000,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    }).onfinish = () => s.remove();
                }, i * 10);
            }

            // Add extra butterflies
            for(let i = 0; i < 5; i++) {
                setTimeout(createButterfly, i * 500);
            }
        }

        // Auto generation
        setInterval(createFloatingItem, 800);
        setInterval(createButterfly, 6000);

        // Initial items
        for(let i = 0; i < 10; i++) createFloatingItem();
        createButterfly();

        // Mouse move effect on card
        const card = document.querySelector('.card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'all 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });
    </script>
</body>
</html>
